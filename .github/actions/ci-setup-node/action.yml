name: CI setup node
description: pnpm, Node, Turbo cache, and install with frozen lockfile. Run actions/checkout before this action.

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # version comes from root package.json "packageManager" (single source of truth)

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ".nvmrc"
        cache: "pnpm"
        cache-dependency-path: |
          **/pnpm-lock.yaml

    # Align with Node cache (cache-dependency-path: **/pnpm-lock.yaml) to avoid stale cache.
    - name: Cache turbo build setup
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-turbo-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
