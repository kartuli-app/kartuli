name: Labels Sync Available on GitHub from Repo Config
# Triggers: manual workflow_dispatch
# Purpose: Keep GitHub labels in sync with configuration file

# This workflow syncs the labels defined in .github/labels.yml with GitHub
# It runs manually via workflow_dispatch

on:
  workflow_dispatch:
    inputs:
      delete-other-labels:
        description: 'Delete labels not in config file?'
        required: true
        type: boolean
        default: false

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync labels
        uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          yaml-file: .github/labels.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}
          skip-delete: ${{ ! inputs.delete-other-labels }}
