name: Labels Sync Available on GitHub from Repo Config
# Triggers: manual workflow_dispatch
# Purpose: Keep GitHub labels in sync with configuration file

# This workflow syncs the labels defined in .github/labels.yml with GitHub
# It runs manually via workflow_dispatch

on:
  workflow_dispatch:
    inputs:
      delete-other-labels:
        description: 'Delete labels not in config file?'
        required: true
        type: boolean
        default: false

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync labels
        uses: EndBug/label-sync@5594ed7b544bfb68a18aa061740f5c2f726eb91a # Node 24 runtime (unreleased)
        with:
          config-file: .github/labels.yml
          token: ${{ secrets.GITHUB_TOKEN }}
          delete-other-labels: ${{ inputs.delete-other-labels }}
