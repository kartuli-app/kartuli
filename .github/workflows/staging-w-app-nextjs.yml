name: Staging - Next.js app

run-name: "Staging Next.js - ${{ inputs.target }} (${{ inputs.deploy_target }})"

on:
  workflow_call:
    inputs:
      target:
        description: Target workspace (e.g. game-client, backoffice-client).
        required: true
        type: string
      deploy_target:
        description: Where to run/deploy (local = build + start + Lighthouse).
        required: true
        type: string
      pull_request_number:
        description: PR number (for commenting when called from orchestrator).
        required: false
        type: string
    secrets:
      TURBO_TOKEN:
        required: true
      VERCEL_TOKEN:
        required: false
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID_GAME_CLIENT:
        required: false
      VERCEL_PROJECT_ID_BACKOFFICE_CLIENT:
        required: false
      KARTULIAPP_TEAM_BOT_TOKEN:
        required: false
      KARTULIAPP_TEAM_GROUP_CHAT_ID:
        required: false
      KARTULIAPP_TEAM_TOPIC_PREVIEW_DEPLOYMENTS_ID:
        required: false
  workflow_dispatch:
    inputs:
      target:
        description: Next.js app to run.
        required: true
        type: choice
        default: game-client
        options:
          - game-client
          - backoffice-client
      deploy_target:
        description: Where to run / deploy.
        required: true
        type: choice
        default: local
        options:
          - local
          - vercel
      pull_request_number:
        description: Optional PR number for updating the staging result comment.
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-build-and-quality:
    name: validate-build-and-quality
    runs-on: ubuntu-26.04
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TARGET: ${{ inputs.target }}
      DEPLOY_TARGET: ${{ inputs.deploy_target }}
      APP_URL: ${{ inputs.target == 'backoffice-client' && 'http://localhost:3001' || 'http://localhost:3000' }}
      LIGHTHOUSE_AUDIT_PATH: ${{ inputs.target == 'backoffice-client' && '/en' || '/en/explore/alphabet' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: CI setup node
        uses: ./.github/actions/ci-setup-node

      - name: CI validate monorepo package
        if: github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/ci-validate-monorepo-package
        with:
          target: ${{ inputs.target }}

      - name: Get app version for build
        id: get_version
        env:
          TARGET: ${{ inputs.target }}
          DEPLOY_TARGET: ${{ inputs.deploy_target }}
        run: |
          PKG_VERSION=$(node -p "require('./apps/$TARGET/package.json').version")
          SHORT_SHA="${GITHUB_SHA:0:7}"
          APP_VERSION="${PKG_VERSION}-${DEPLOY_TARGET}-${SHORT_SHA}"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build
        if: inputs.deploy_target == 'local'
        env:
          TARGET: ${{ inputs.target }}
          NEXT_PUBLIC_APP_VERSION: ${{ steps.get_version.outputs.app_version }}
        run: pnpm turbo run build --filter=@kartuli/"$TARGET"
        shell: bash

      - name: Start server (background)
        if: inputs.deploy_target == 'local'
        env:
          TARGET: ${{ inputs.target }}
        run: |
          pnpm --filter @kartuli/"$TARGET" run start &
          for i in $(seq 1 60); do
            if curl -fsS "$APP_URL" >/dev/null 2>&1; then
              echo "Server is up."
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: Server did not become ready in time."
          exit 1
        shell: bash

      - name: Deploy to Vercel Preview
        if: inputs.deploy_target == 'vercel'
        id: deploy
        uses: amondnet/vercel-action@de09aeac2ace6599ec9b11ef87558759a496bac4 # v42.3.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ inputs.target == 'game-client' && secrets.VERCEL_PROJECT_ID_GAME_CLIENT || secrets.VERCEL_PROJECT_ID_BACKOFFICE_CLIENT }}
          vercel-version: 65.5.0
          scope: ${{ secrets.VERCEL_ORG_ID }}
          github-comment: ${{ github.event_name == 'pull_request' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-deployment: false

      - name: Resolve Lighthouse audit URL
        id: lighthouse_url
        env:
          STEP_APP_URL: ${{ inputs.deploy_target == 'local' && env.APP_URL || steps.deploy.outputs.preview-url }}
        run: |
          if [ -z "$STEP_APP_URL" ]; then
            echo "ERROR: App URL is empty (deploy_target=$DEPLOY_TARGET)."
            exit 1
          fi
          AUDIT_URL="${STEP_APP_URL%/}${LIGHTHOUSE_AUDIT_PATH}"
          echo "url=$AUDIT_URL" >> "$GITHUB_OUTPUT"
          echo "Requested Lighthouse audit URL: $AUDIT_URL"
        shell: bash

      - name: Run Lighthouse CI (informational)
        id: lighthouse
        continue-on-error: true
        env:
          CI_AUDIT: "true"
          AUDIT_URL: ${{ steps.lighthouse_url.outputs.url }}
        run: pnpm exec lhci autorun --failOnUploadFailure --collect.url="$AUDIT_URL"
        shell: bash

      - name: Build Lighthouse summary
        if: always()
        id: lighthouse_summary
        continue-on-error: true
        env:
          AUDIT_URL: ${{ steps.lighthouse_url.outputs.url }}
          AUDIT_OUTCOME: ${{ steps.lighthouse.outcome }}
        run: |
          node scripts/lighthouse/report-cli.mjs \
            --requested-url="$AUDIT_URL" \
            --audit-outcome="$AUDIT_OUTCOME" \
            --output=lighthouse-summary.md
        shell: bash

      - name: Upload Lighthouse CI diagnostics on failure
        if: ${{ always() && (steps.lighthouse.outcome == 'failure' || steps.lighthouse_summary.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-artifacts-${{ inputs.target }}-${{ inputs.deploy_target }}-${{ github.run_number }}
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 7

      - name: Comment PR with Lighthouse report
        if: ${{ always() && (github.event_name == 'pull_request' || inputs.pull_request_number != '') }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOY_TARGET: ${{ inputs.deploy_target }}
          LIGHTHOUSE_SUMMARY_PATH: lighthouse-summary.md
          PREVIEW_URL: ${{ steps.deploy.outputs.preview-url }}
        with:
          script: |
            const fs = require('node:fs');
            const prNumber = context.payload.pull_request?.number || '${{ inputs.pull_request_number }}';
            const prNum = Number(prNumber);
            if (!prNum) return;
            const summary = fs.existsSync(process.env.LIGHTHOUSE_SUMMARY_PATH)
              ? fs.readFileSync(process.env.LIGHTHOUSE_SUMMARY_PATH, 'utf8').trim()
              : `### Lighthouse

            **Audit/reporting status:** Incomplete. The Lighthouse summary could not be generated.

            [Inspect the workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            const deployTarget = process.env.DEPLOY_TARGET;
            const previewUrl = process.env.PREVIEW_URL;
            const previewLine = deployTarget === 'vercel' && previewUrl
              ? `\n\n[Preview](${previewUrl})`
              : '';
            const commentBody = `## Staging – Next.js (${{ inputs.target }}) – ${deployTarget}

            ${summary}${previewLine}

            ---
            *Staging pipeline*`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNum,
            });
            const targetLabel = '## Staging – Next.js (${{ inputs.target }}) – ${{ inputs.deploy_target }}';
            const botComment = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes(targetLabel)
            );
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNum,
                body: commentBody,
              });
            }

      - name: Build Telegram preview deploy message
        if: inputs.deploy_target == 'vercel'
        id: notify_preview
        env:
          WHO: ${{ github.event.pull_request.user.login || github.actor }}
          APP: ${{ inputs.target }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview-url }}
          REPORT_URL: ${{ steps.lighthouse_summary.outputs.report_url }}
          PR_NUM: ${{ github.event.pull_request.number || inputs.pull_request_number }}
          PR_LINK: ${{ github.event.pull_request.html_url }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$PR_LINK" ] && [ -n "$PR_NUM" ]; then
            PR_LINK="${SERVER_URL}/${REPO}/pull/${PR_NUM}"
          fi
          MSG="[Preview] $APP deployed by $WHO"
          [ -n "$PREVIEW_URL" ] && MSG="$MSG"$'\n'"Preview: $PREVIEW_URL"
          [ -n "$REPORT_URL" ] && MSG="$MSG"$'\n'"Lighthouse: $REPORT_URL"
          [ -n "$PR_LINK" ] && MSG="$MSG"$'\n'"PR: $PR_LINK"
          echo "message<<NOTIFY_EOF" >> "$GITHUB_OUTPUT"
          echo "$MSG" >> "$GITHUB_OUTPUT"
          echo "NOTIFY_EOF" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Notify Telegram – Deployments Preview
        if: inputs.deploy_target == 'vercel'
        uses: ./.github/actions/telegram-send-message
        with:
          telegram_bot_token: ${{ secrets.KARTULIAPP_TEAM_BOT_TOKEN }}
          chat_id: ${{ secrets.KARTULIAPP_TEAM_GROUP_CHAT_ID }}
          message_thread_id: ${{ secrets.KARTULIAPP_TEAM_TOPIC_PREVIEW_DEPLOYMENTS_ID }}
          message: ${{ steps.notify_preview.outputs.message }}

      - name: Setup Playwright
        uses: ./.github/actions/ci-setup-playwright

      - name: Run E2E
        env:
          BASE_URL: ${{ inputs.deploy_target == 'local' && env.APP_URL || steps.deploy.outputs.preview-url }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "ERROR: BASE_URL is empty (deploy_target=$DEPLOY_TARGET)."
            exit 1
          fi
          pnpm e2e "$TARGET" --url "$BASE_URL"
        shell: bash

      - name: Upload retained E2E artifacts
        if: always()
        uses: ./.github/actions/upload-retained-e2e-artifacts
        with:
          name: e2e-artifacts-${{ inputs.target }}-${{ inputs.deploy_target }}-${{ github.run_number }}
