name: Production – Game Client

on:
  push:
    branches: [main]
    paths:
      - 'apps/game-client/**'
      - 'packages/tailwind-config/**'
      - 'packages/ui/**'
      - 'tools/e2e/**'
      - '.nvmrc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'turbo.json'
      - '.github/workflows/production-w-app-game-client.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-w-app-game-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-26.04
    if: github.ref == 'refs/heads/main'
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TARGET: game-client
      PRODUCTION_URL: https://www.kartuli.app
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: CI setup node
        uses: ./.github/actions/ci-setup-node

      - name: CI validate monorepo package
        uses: ./.github/actions/ci-validate-monorepo-package
        with:
          target: game-client

      - name: Deploy to Vercel
        id: deploy
        uses: amondnet/vercel-action@de09aeac2ace6599ec9b11ef87558759a496bac4 # v42.3.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_GAME_CLIENT }}
          vercel-version: 63.1.2
          vercel-args: '--prod'
          scope: ${{ secrets.VERCEL_ORG_ID }}
          github-comment: false
          github-deployment: false

      - name: Setup Playwright
        uses: ./.github/actions/ci-setup-playwright

      - name: Run E2E production tests
        env:
          BASE_URL: ${{ env.PRODUCTION_URL }}
        run: pnpm --filter @kartuli/e2e exec playwright test tests/game-client/production

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts-game-client-prod-${{ github.run_number }}
          path: tools/e2e/test-results/
          retention-days: 3

      - name: Build Telegram production deploy message
        if: success()
        id: notify_prod
        env:
          WHO: ${{ github.actor }}
          APP: ${{ env.TARGET }}
          PROD_URL: ${{ env.PRODUCTION_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "message<<NOTIFY_EOF" >> "$GITHUB_OUTPUT"
          echo "[Production] $APP deployed by $WHO" >> "$GITHUB_OUTPUT"
          echo "URL: $PROD_URL" >> "$GITHUB_OUTPUT"
          echo "Run: $RUN_URL" >> "$GITHUB_OUTPUT"
          echo "NOTIFY_EOF" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Notify Telegram – Deployments Production
        if: success()
        uses: ./.github/actions/telegram-send-message
        with:
          telegram_bot_token: ${{ secrets.KARTULIAPP_TEAM_BOT_TOKEN }}
          chat_id: ${{ secrets.KARTULIAPP_TEAM_GROUP_CHAT_ID }}
          message_thread_id: ${{ secrets.KARTULIAPP_TEAM_TOPIC_PRODUCTION_DEPLOYMENTS_ID }}
          message: ${{ steps.notify_prod.outputs.message }}

  lighthouse:
    name: Lighthouse audit (informational)
    needs: deploy
    runs-on: ubuntu-26.04
    continue-on-error: true
    env:
      PRODUCTION_URL: https://www.kartuli.app
      LIGHTHOUSE_AUDIT_PATH: /en/explore/alphabet
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: CI setup node
        uses: ./.github/actions/ci-setup-node

      - name: Resolve Lighthouse audit URL
        id: lighthouse_url
        run: |
          AUDIT_URL="${PRODUCTION_URL%/}${LIGHTHOUSE_AUDIT_PATH}"
          echo "url=$AUDIT_URL" >> "$GITHUB_OUTPUT"
          echo "Requested Lighthouse audit URL: $AUDIT_URL"
        shell: bash

      - name: Run Lighthouse CI
        id: lighthouse
        env:
          CI_AUDIT: "true"
          AUDIT_URL: ${{ steps.lighthouse_url.outputs.url }}
        run: pnpm exec lhci autorun --failOnUploadFailure --collect.url="$AUDIT_URL"
        shell: bash

      - name: Build Lighthouse summary
        if: always()
        id: lighthouse_summary
        env:
          AUDIT_URL: ${{ steps.lighthouse_url.outputs.url }}
          AUDIT_OUTCOME: ${{ steps.lighthouse.outcome }}
        run: |
          node scripts/lighthouse/report-cli.mjs \
            --requested-url="$AUDIT_URL" \
            --audit-outcome="$AUDIT_OUTCOME" \
            --output=lighthouse-summary.md
        shell: bash

      - name: Write Lighthouse report to job summary
        if: always()
        run: |
          echo "## Production – Game Client" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f lighthouse-summary.md ]; then
            cat lighthouse-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Lighthouse" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Audit/reporting status:** Incomplete. The Lighthouse summary could not be generated." >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash

      - name: Upload Lighthouse CI diagnostics on failure
        if: ${{ always() && (steps.lighthouse.outcome == 'failure' || steps.lighthouse_summary.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-artifacts-game-client-prod-${{ github.run_number }}
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 7
