name: Staging – Storybook

on:
  workflow_call:
    secrets:
      TURBO_TOKEN:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build-and-quality:
    name: validate-build-and-quality
    runs-on: ubuntu-26.04
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: CI setup node
        uses: ./.github/actions/ci-setup-node

      - name: Setup Playwright
        uses: ./.github/actions/ci-setup-playwright

      - name: CI validate monorepo package
        if: github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/ci-validate-monorepo-package
        with:
          target: storybook

      - name: Build
        run: pnpm turbo run build --filter=@kartuli/storybook
        shell: bash

      - name: Start preview server (background)
        run: |
          set -euo pipefail
          pnpm turbo run preview --filter=@kartuli/storybook &
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:6006" >/dev/null 2>&1; then
              echo "Preview server is up."
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: Preview server did not become ready in time."
          exit 1
        shell: bash

      - name: Run E2E
        run: pnpm e2e storybook --url "http://localhost:6006"
        shell: bash

      - name: Upload retained E2E artifacts
        if: always()
        uses: ./.github/actions/upload-retained-e2e-artifacts
        with:
          name: e2e-artifacts-storybook-staging-${{ github.run_number }}
